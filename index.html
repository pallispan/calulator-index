<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Calculator</title>
	<style>
		body{font-family: Arial, Helvetica, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f0f0f0;margin:0}
		.calc{background:#222;color:#fff;padding:16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.2);width:320px}
		.display{background:#000;color:#0f0;padding:12px;font-size:24px;border-radius:4px;margin-bottom:12px;word-wrap:break-word;min-height:40px}
		.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
		button{padding:16px;font-size:18px;border:0;border-radius:6px;cursor:pointer}
		.btn-op{background:#ff9500;color:#fff}
		.btn-num{background:#333;color:#fff}
		.btn-ac{background:#ff3b30;color:#fff}
		.btn-eq{background:#34c759;color:#fff;grid-column:span 2}
	</style>
</head>
<body>
	<div class="calc">
		<div id="display" class="display">0</div>
		<div class="keys">
			<button class="btn-ac" data-action="clear">AC</button>
			<button data-action="back">⌫</button>
			<button data-action="percent">%</button>
			<button class="btn-op" data-action="op">/</button>

			<button class="btn-num">7</button>
			<button class="btn-num">8</button>
			<button class="btn-num">9</button>
			<button class="btn-op" data-action="op">*</button>

			<button class="btn-num">4</button>
			<button class="btn-num">5</button>
			<button class="btn-num">6</button>
			<button class="btn-op" data-action="op">-</button>

			<button class="btn-num">1</button>
			<button class="btn-num">2</button>
			<button class="btn-num">3</button>
			<button class="btn-op" data-action="op">+</button>

			<button class="btn-num">0</button>
			<button class="btn-num">.</button>
			<button class="btn-eq" data-action="equals">=</button>
		</div>
	</div>

	<script>
		const display = document.getElementById('display');
		let expr = '';

		function updateDisplay() { display.textContent = expr || '0'; }

		function safeEval(s) {
			try {
				// allow only digits, operators, parentheses, dot and percent
				if (!/^[0-9+\-*/().%\s]+$/.test(s)) throw 0;
				// replace percent with /100
				const normalized = s.replace(/%/g, '/100');
				// eslint-disable-next-line no-new-func
				return Function('return (' + normalized + ')')();
			} catch (e) { return 'Error'; }
		}

		document.querySelectorAll('button').forEach(btn => {
			btn.addEventListener('click', () => {
				const action = btn.dataset.action;
				const val = btn.textContent;
				if (!action) { // number or dot
					expr += val;
				} else if (action === 'op') {
					expr += ' ' + val + ' ';
				} else if (action === 'clear') {
					expr = '';
				} else if (action === 'back') {
					expr = expr.trim(); expr = expr.slice(0, -1);
				} else if (action === 'percent') {
					expr += '%';
				} else if (action === 'equals') {
					const res = safeEval(expr);
					expr = (res === 'Error') ? '' : String(res);
				}
				updateDisplay();
			});
		});

		window.addEventListener('keydown', e => {
			if ((/\d|\.|\+|\-|\*|\//).test(e.key)) { expr += e.key; updateDisplay(); }
			else if (e.key === 'Enter') { const r = safeEval(expr); expr = (r === 'Error') ? '' : String(r); updateDisplay(); }
			else if (e.key === 'Backspace') { expr = expr.slice(0,-1); updateDisplay(); }
			else if (e.key === '%') { expr += '%'; updateDisplay(); }
			else if (e.key === 'Escape') { expr = ''; updateDisplay(); }
		});
	</script>

	<!--
	Quick deploy instructions:
	- GitHub Pages: create a repo, add this file as index.html, enable Pages from main branch.
	- Netlify/Vercel: drag-and-drop the folder or connect the repo; they will host the static site.
	- Simple option: run a static server (python -m http.server) on any VPS and point a domain.
	-->

	<div style="position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,0.6);color:#fff;padding:8px;border-radius:6px;font-size:12px;max-width:320px">
	Hosted on the web: upload this file as index.html to GitHub Pages, Netlify, or Vercel.
	</div>
</body>
</html>
