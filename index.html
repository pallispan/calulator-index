<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Αριθμομηχανή</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f8fafc; background: radial-gradient(circle at 15% 15%, #334155 0, transparent 35%), radial-gradient(circle at 85% 85%, #312e81 0, transparent 34%), #111827; }
    .calculator { width: min(100%, 390px); padding: 20px; border: 1px solid rgb(255 255 255 / 12%); border-radius: 28px; background: rgb(15 23 42 / 88%); box-shadow: 0 24px 60px rgb(0 0 0 / 35%); backdrop-filter: blur(18px); }
    .header { display: flex; justify-content: space-between; align-items: center; margin: 2px 4px 20px; }
    h1 { margin: 0; font-size: 1rem; letter-spacing: .02em; }
    .hint { color: #94a3b8; font-size: .74rem; }
    .screen { min-height: 126px; display: flex; flex-direction: column; align-items: flex-end; justify-content: end; gap: 8px; padding: 16px; margin-bottom: 16px; overflow: hidden; border-radius: 18px; background: #020617; box-shadow: inset 0 1px 5px rgb(0 0 0 / 50%); }
    .expression { width: 100%; min-height: 22px; overflow: hidden; color: #94a3b8; font-size: .9rem; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    output { max-width: 100%; overflow: hidden; font-size: clamp(2.2rem, 10vw, 3.6rem); font-weight: 650; letter-spacing: -.06em; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { min-height: 60px; border: 0; border-radius: 16px; color: #f8fafc; background: #1e293b; font: inherit; font-size: 1.18rem; font-weight: 600; cursor: pointer; transition: transform .12s ease, filter .12s ease, background .12s ease; -webkit-tap-highlight-color: transparent; }
    button:hover { filter: brightness(1.15); }
    button:active { transform: scale(.94); }
    button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
    .function { color: #cbd5e1; background: #334155; }
    .operator { color: #fff; background: #4f46e5; }
    .equals { color: #0f172a; background: #67e8f9; }
    .wide { grid-column: span 2; }
    .footer { margin: 18px 4px 0; color: #64748b; font-size: .72rem; text-align: center; }
    @media (max-width: 380px) { body { padding: 12px; } .calculator { padding: 15px; border-radius: 22px; } button { min-height: 56px; } }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Αριθμομηχανή">
    <div class="header"><h1>Αριθμομηχανή</h1><span class="hint">⌨ Enter =</span></div>
    <section class="screen" aria-live="polite" aria-atomic="true">
      <div id="expression" class="expression"> </div>
      <output id="display">0</output>
    </section>
    <div class="keys" aria-label="Πλήκτρα αριθμομηχανής">
      <button class="function" data-action="clear" aria-label="Εκκαθάριση">AC</button>
      <button class="function" data-action="sign" aria-label="Αλλαγή προσήμου">±</button>
      <button class="function" data-action="percent" aria-label="Ποσοστό">%</button>
      <button class="operator" data-operator="÷" aria-label="Διαίρεση">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-operator="×" aria-label="Πολλαπλασιασμός">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-operator="−" aria-label="Αφαίρεση">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-operator="+" aria-label="Πρόσθεση">+</button>
      <button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals" aria-label="Ίσον">=</button>
    </div>
    <p class="footer">Χρησιμοποίησε και το πληκτρολόγιό σου.</p>
  </main>
  <script>
    const display = document.querySelector('#display');
    const expression = document.querySelector('#expression');
    const operators = { '+': (a, b) => a + b, '−': (a, b) => a - b, '×': (a, b) => a * b, '÷': (a, b) => b === 0 ? null : a / b };
    let current = '0';
    let previous = null;
    let operator = null;
    let waitingForNumber = false;

    const formatNumber = value => {
      const number = Number(value);
      if (!Number.isFinite(number)) return 'Σφάλμα';
      return new Intl.NumberFormat('el-GR', { maximumFractionDigits: 10 }).format(number);
    };
    const refresh = () => {
      display.textContent = formatNumber(current);
      expression.textContent = previous === null || !operator ? ' ' : `${formatNumber(previous)} ${operator}`;
    };
    const reset = () => { current = '0'; previous = null; operator = null; waitingForNumber = false; refresh(); };
    const inputNumber = value => {
      if (waitingForNumber) { current = value === '.' ? '0.' : value; waitingForNumber = false; }
      else if (value === '.' && !current.includes('.')) current += '.';
      else if (value !== '.') current = current === '0' ? value : current + value;
      refresh();
    };
    const calculate = () => {
      if (previous === null || !operator || waitingForNumber) return;
      const result = operators[operator](previous, Number(current));
      current = result === null ? 'Σφάλμα' : String(Number(result.toPrecision(12)));
      previous = null; operator = null; waitingForNumber = true; refresh();
    };
    const chooseOperator = nextOperator => {
      if (current === 'Σφάλμα') return reset();
      if (operator && !waitingForNumber) calculate();
      previous = Number(current); operator = nextOperator; waitingForNumber = true; refresh();
    };
    const changeSign = () => { if (current !== '0' && current !== 'Σφάλμα') { current = String(-Number(current)); refresh(); } };
    const percent = () => { if (current !== 'Σφάλμα') { current = String(Number(current) / 100); refresh(); } };

    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.value !== undefined) inputNumber(button.dataset.value);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else if (button.dataset.action === 'clear') reset();
      else if (button.dataset.action === 'sign') changeSign();
      else if (button.dataset.action === 'percent') percent();
      else if (button.dataset.action === 'equals') calculate();
    });
    window.addEventListener('keydown', event => {
      const key = event.key;
      if (/^\d$/.test(key) || key === '.') inputNumber(key);
      else if ({ '+': '+', '-': '−', '*': '×', '/': '÷' }[key]) chooseOperator({ '+': '+', '-': '−', '*': '×', '/': '÷' }[key]);
      else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
      else if (key === 'Escape') reset();
      else if (key === '%') percent();
      else if (key === 'Backspace' && !waitingForNumber) { current = current.length > 1 ? current.slice(0, -1) : '0'; refresh(); }
    });
    refresh();
  </script>
</body>
</html>
